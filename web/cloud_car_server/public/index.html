<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>先锋号 · 气象观测站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 天幕背景层 -->
  <div class="sky" aria-hidden="true">
    <div class="sky-glow sky-glow--sun"></div>
    <div class="sky-glow sky-glow--horizon"></div>
    <div class="sky-grain"></div>
  </div>

  <div class="page">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.6"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">先锋号 · 气象观测站</span>
          <span class="brand-sub">Hi3861 → 华为云 → 实时环境监测</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="conn" id="conn">
          <span class="conn-dot" id="conn-dot"></span>
          <span class="conn-label" id="conn-label">连接中</span>
        </div>
        <div class="device-pill" id="device-pill">
          <span class="device-dot" id="device-dot"></span>
          <span id="device-status">设备状态未知</span>
        </div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <!-- 主数据区 -->
    <main class="layout">
      <!-- 温度主角 -->
      <section class="hero card" id="hero">
        <div class="hero-meta">
          <span class="hero-kicker">当前温度 · Temperature</span>
          <div class="hero-value">
            <span class="hero-num" id="temp-hero">—</span><span class="hero-unit">°C</span>
          </div>
          <p class="hero-desc" id="temp-desc">等待数据…</p>
        </div>
        <div class="hero-side">
          <div class="hero-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M10 13.5V5a2 2 0 1 1 4 0v8.5a4.5 4.5 0 1 1-4 0Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="17.5" r="1.8" fill="currentColor"/></svg>
          </div>
          <div class="hero-delta" id="temp-delta">—</div>
        </div>
      </section>

      <!-- 指标卡片 -->
      <section class="cards">
        <div class="card metric" id="card-humidity">
          <div class="metric-head">
            <span class="metric-icon metric-icon--humi" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3s6 6.3 6 11a6 6 0 1 1-12 0c0-4.7 6-11 6-11Z" stroke="currentColor" stroke-width="1.5"/></svg>
            </span>
            <span class="metric-name">湿度 Humidity</span>
          </div>
          <div class="metric-value"><span id="humi-val">—</span><span class="metric-unit">%</span></div>
          <canvas class="spark" id="spark-humi" height="40"></canvas>
          <div class="metric-range"><span id="humi-min">最低 —</span><span id="humi-max">最高 —</span></div>
        </div>

        <div class="card metric" id="card-light">
          <div class="metric-head">
            <span class="metric-icon metric-icon--light" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <span class="metric-name">光照 Light</span>
          </div>
          <div class="metric-value"><span id="light-val">—</span><span class="metric-unit">lux</span></div>
          <canvas class="spark" id="spark-light" height="40"></canvas>
          <div class="metric-range"><span id="light-min">最低 —</span><span id="light-max">最高 —</span></div>
        </div>

        <div class="card metric metric--status" id="card-fresh">
          <div class="metric-head">
            <span class="metric-icon metric-icon--fresh" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.5"/><path d="M12 7.5V12l3 2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <span class="metric-name">数据时效</span>
          </div>
          <div class="metric-value metric-value--fresh"><span id="fresh-val">—</span></div>
          <p class="fresh-note" id="fresh-note">等待数据…</p>
          <div class="metric-range"><span>上报周期 5s</span><span id="fresh-time">—</span></div>
        </div>
      </section>

      <!-- 主曲线 -->
      <section class="card chart-panel">
        <div class="chart-head">
          <div class="chart-title">
            <h2>温湿度实时曲线</h2>
            <span class="chart-sub" id="chart-range">—</span>
          </div>
          <div class="legend">
            <span class="legend-item"><i class="lg lg--temp"></i>温度 °C</span>
            <span class="legend-item"><i class="lg lg--humi"></i>湿度 %</span>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="chart"></canvas>
          <div class="chart-tooltip" id="chart-tooltip"></div>
          <div class="chart-empty" id="chart-empty">等待设备上报数据…</div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>WebSocket 实时推送 · 后端 3s 轮询华为云影子</span>
      <span id="foot-conn">未连接</span>
    </footer>
  </div>

  <!-- 迷你遥控坞（保留控制能力，不抢主视觉） -->
  <div class="dock" id="dock">
    <button class="dock-toggle" id="dock-toggle" title="展开/收起遥控" aria-label="遥控">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 7l1.8 3.2L17 12l-3.2 1.8L12 17l-1.8-3.2L7 12l3.2-1.8L12 7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
    <div class="dock-pad" id="dock-pad" hidden>
      <button class="dp dp-up" data-dir="FWD" title="前进">▲</button>
      <button class="dp dp-left" data-dir="LEFT" title="左转">◀</button>
      <button class="dp dp-stop" data-dir="STOP" title="停止">■</button>
      <button class="dp dp-right" data-dir="RIGHT" title="右转">▶</button>
      <button class="dp dp-down" data-dir="BACK" title="后退">▼</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
